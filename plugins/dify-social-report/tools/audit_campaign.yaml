identity:
  name: audit_campaign
  author: czoemeijer
  label:
    en_US: Audit campaign
description:
  human:
    en_US: Calculate scope-aware campaign metrics and deterministic QA findings.
  llm: Never recomputes with an LLM. Returns isolated scope buckets, warnings, and review status.
parameters:
  - name: campaign_json
    type: object
    required: true
    label:
      en_US: Validated campaign JSON
    human_description:
      en_US: Validated canonical extraction output for all grouped campaign assets.
    llm_description: Object containing the validated assets array.
    form: llm
output_schema:
  type: object
  properties:
    audit:
      type: object
      description: Deterministic audit calculation results and QA findings
    audit_json:
      type: string
      description: Compact JSON string representation of the audit result
extra:
  python:
    source: tools/audit_campaign.py
