identity:
  name: validate_extraction
  author: czoemeijer
  label:
    en_US: Validate vision extraction
description:
  human:
    en_US: Validate and normalize structured JSON returned by the vision model.
  llm: Enforces numeric, precision, confidence, scope, null, and review-status semantics.
parameters:
  - name: extraction_json
    type: object
    required: true
    label:
      en_US: Extraction JSON
    human_description:
      en_US: Structured JSON from the per-asset vision extraction step.
    llm_description: Object matching the extracted_asset schema or containing an assets array.
    form: llm
output_schema:
  type: object
  properties:
    validated:
      type: object
      description: Validated and normalized campaign JSON object
    validated_json:
      type: string
      description: Compact JSON string of validated extraction output
extra:
  python:
    source: tools/validate_extraction.py
