app:
  description: Reconstruct and audit a social-media campaign from screenshots or one human-organized ZIP.
  icon: 📊
  icon_background: '#17324D'
  icon_type: emoji
  mode: workflow
  name: Social Media Campaign Report
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: package
