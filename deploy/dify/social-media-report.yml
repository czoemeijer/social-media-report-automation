      - data:
          code: |-
            def main(original_campaign: dict, corrected_assets: list) -> dict:
                orig_assets = original_campaign.get("assets", []) if isinstance(original_campaign, dict) else []
                corrected_map = {}
                for a in (corrected_assets or []):
                    if isinstance(a, dict) and a.get("asset_group_id"):
                        corrected_map[a["asset_group_id"]] = a

                merged_assets = []
                for a in orig_assets:
                    gid = a.get("asset_group_id") if isinstance(a, dict) else None
                    if gid and gid in corrected_map:
                        merged_assets.append(corrected_map[gid])
                    else:
                        merged_assets.append(a)

                return {"campaign": {"assets": merged_assets}}
          code_language: python3
          desc: Merge reviewed assets while preserving non-reviewed assets byte-for-byte.
          outputs:
            campaign: {children: null, type: object}
          selected: false
          title: Merge reviewed assets
          type: code
          variables:
            - value_selector: [validate, validated]
              value_type: object
              variable: original_campaign
            - value_selector: [review_iteration, output]
              value_type: array[object]
              variable: corrected_assets
        height: 100
        id: merge_reviewed_assets
