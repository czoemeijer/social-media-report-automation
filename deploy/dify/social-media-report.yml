        - .JPG
        - .JPEG
        - .WEBP
        - .GIF
        - .ZIP
      allowed_file_types:
        - image
        - document
        - custom
      allowed_file_upload_methods:
        - local_file
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 25
        audio_file_size_limit: 50
        batch_count_limit: 30
        file_size_limit: 25
        file_upload_limit: 30
        image_file_batch_limit: 30
        image_file_size_limit: 25
        single_chunk_attachment_limit: 30
        video_file_size_limit: 100
        workflow_file_upload_limit: 30
      image:
        enabled: false
        number_limits: 30
        transfer_methods:
          - local_file
      number_limits: 30
    opening_statement: Upload campaign screenshots or one ZIP, then press Run.
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
