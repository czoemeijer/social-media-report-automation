            properties:
              files: {type: array, items: {type: file}}
              selected_count: {type: number}
          paramSchemas:
            - {name: files, type: files, required: true, form: llm, label: {en_US: Files}, human_description: {en_US: Canonical files}, llm_description: Canonical files}
            - {name: asset, type: object, required: true, form: llm, label: {en_US: Asset}, human_description: {en_US: Reconstructed asset}, llm_description: Current asset}
          params: {files: '', asset: ''}
          provider_id: czoemeijer/dify-social-report/social_report
          provider_name: czoemeijer/dify-social-report/social_report
          provider_type: builtin
          selected: false
          title: Select asset files
          tool_configurations: {}
          tool_description: Select screenshots for the current asset group.
          tool_label: Select asset files
          tool_name: select_asset_files
          tool_node_version: '2'
          tool_parameters:
            files: {type: variable, value: [normalize, files]}
            asset: {type: variable, value: [extract_iteration, item]}
          type: tool
        height: 110
        id: select_files
        parentId: extract_iteration
        position: {x: 105, y: 105}
        positionAbsolute: {x: 1405, y: 345}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 250
        zIndex: 1002
      - data:
          context: {enabled: false, variable_selector: []}
          desc: Exact structured extraction; no prose or arithmetic.
          isInIteration: true
          iteration_id: extract_iteration
          memory: {enabled: false, window: {enabled: false, size: 20}}
          model: {completion_params: {temperature: 0}, mode: chat, name: '', provider: ''}
          prompt_template:
            - role: system
              text: >-
                Extract exactly one reconstructed asset. Exact numbers stay exact; abbreviations are
                approximate with evidence_text; missing and unreadable values are null; visible zero
                is exact zero. Preserve source provenance and never calculate rates or totals. Always
                copy source_files exactly from the Asset context.
            - role: user
              text: |-
                Asset context: {{#extract_iteration.item#}}
                Optional instruction: {{#start.optional_instruction#}}
          selected: false
          structured_output:
            schema:
              type: object
              required: [asset_group_id, platform, content_format, scope, source_files, metrics, review_status]
              properties:
                asset_group_id: {type: string}
                creator: {type: [string, 'null']}
                platform: {type: string, enum: [instagram, facebook, meta, unknown]}
                content_format: {type: string, enum: [post, reel, story, ad, unknown]}
                scope: {type: string, enum: [organic, paid, mixed_or_unknown, unknown]}
                has_ad_disclaimer: {type: boolean}
                source_files: {type: array, minItems: 1, items: {type: string}}
                metrics:
                  type: object
                  additionalProperties:
                    type: object
                    required: [value, precision]
                    properties:
                      value: {type: [number, 'null'], minimum: 0}
                      precision: {type: string, enum: [exact, approximate, missing, unreadable]}
                      confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
                      source_file: {type: [string, 'null']}
                      evidence_text: {type: [string, 'null']}
                      extraction_method: {type: string, enum: [vision, manual, ocr]}
                review_status: {type: string, enum: [verified, verified_with_warning, needs_review, rejected]}
                warnings: {type: array, items: {type: string}}
          structured_output_enabled: true
          title: Vision extraction
          type: llm
          variables: []
          vision:
            enabled: true
            configs:
              detail: high
              variable_selector: [select_files, files]
        height: 150
        id: extract_asset
        parentId: extract_iteration
        position: {x: 405, y: 105}
        positionAbsolute: {x: 1705, y: 345}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 250
        zIndex: 1002
      - data:
          code: |-
            def main(extractions: list) -> dict:
                return {"campaign": {"assets": extractions}}
          code_language: python3
          desc: Trivial shape conversion only; no business logic.
          outputs:
            campaign: {children: null, type: object}
          selected: false
          title: Assemble extraction object
          type: code
          variables:
            - value_selector: [extract_iteration, output]
              value_type: array[object]
              variable: extractions
        height: 100
        id: join_extractions
        position: {x: 2040, y: 320}
        positionAbsolute: {x: 2040, y: 320}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
      - data:
          desc: Validate null, precision, confidence, enum, and numeric semantics.
          output_schema:
            type: object
            properties:
              validated: {type: object}
              validated_json: {type: string}
          paramSchemas:
            - {name: extraction_json, type: object, required: true, form: llm, label: {en_US: Extraction}, human_description: {en_US: Extraction object}, llm_description: Extraction object}
          params: {extraction_json: ''}
          provider_id: czoemeijer/dify-social-report/social_report
          provider_name: czoemeijer/dify-social-report/social_report
          provider_type: builtin
          selected: false
          title: Validate extraction
          tool_configurations: {}
          tool_description: Validate and normalize structured vision output.
          tool_label: Validate vision extraction
          tool_name: validate_extraction
          tool_node_version: '2'
          tool_parameters:
            extraction_json: {type: variable, value: [join_extractions, campaign]}
          type: tool
        height: 110
        id: validate
        position: {x: 2350, y: 320}
        positionAbsolute: {x: 2350, y: 320}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
      - data:
          cases:
            - case_id: review
              conditions:
                - comparison_operator: contains
                  id: review-status-condition
                  value: needs_review
                  varType: string
                  variable_selector: [validate, validated_json]
              id: review
              logical_operator: and
          desc: Run a second vision pass only for conflicts or low confidence.
          selected: false
          title: Needs review?
          type: if-else
        height: 126
        id: review_gate
        position: {x: 2660, y: 320}
        positionAbsolute: {x: 2660, y: 320}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
      - data:
          code: |-
            def main(campaign: dict) -> dict:
                assets = campaign.get("assets", []) if isinstance(campaign, dict) else []
                review_assets = []
                for a in assets:
                    if not isinstance(a, dict) or a.get("review_status") not in ("needs_review", "rejected"):
                        continue
                    item = dict(a)
                    source_files = item.get("source_files")
                    if not isinstance(source_files, list) or not source_files:
                        metric_files = [
                            m.get("source_file")
                            for m in (item.get("metrics") or {}).values()
                            if isinstance(m, dict) and m.get("source_file")
                        ]
                        item["source_files"] = [f for f in dict.fromkeys(metric_files) if f]
                    review_assets.append(item)
                return {"review_assets": review_assets}
          code_language: python3
          desc: Filter assets requiring review.
          outputs:
            review_assets: {children: null, type: 'array[object]'}
          selected: false
          title: Filter review assets
          type: code
          variables:
            - value_selector: [validate, validated]
              value_type: object
              variable: campaign
        height: 100
        id: filter_review_assets
        position: {x: 2980, y: 180}
        positionAbsolute: {x: 2980, y: 180}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 250
      - data:
          desc: Targeted review of low-confidence or disputed assets only.
          is_parallel: false
          iterator_selector: [filter_review_assets, review_assets]
          output_selector: [second_pass, structured_output]
          output_type: array[object]
          parallel_nums: 1
          selected: false
          start_node_id: review_iterationstart
          title: Review iteration
          type: iteration
        height: 310
        id: review_iteration
        position: {x: 3280, y: 100}
        positionAbsolute: {x: 3280, y: 100}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 690
        zIndex: 1
      - data: {desc: '', isInIteration: true, selected: false, title: '', type: iteration-start}
        draggable: false
        height: 48
        id: review_iterationstart
        parentId: review_iteration
        position: {x: 24, y: 108}
        positionAbsolute: {x: 3304, y: 208}
        selectable: false
        sourcePosition: right
        targetPosition: left
        type: custom-iteration-start
        width: 44
        zIndex: 1002
      - data:
          desc: Restrict vision context strictly to the current asset under review.
          isInIteration: true
          iteration_id: review_iteration
          output_schema:
            type: object
            properties:
              files: {type: array, items: {type: file}}
              selected_count: {type: number}
