          tool_label: Unpack campaign ZIP
          tool_name: unpack_campaign_archive
          tool_node_version: '2'
          tool_parameters:
            files: {type: variable, value: [prepare, files]}
          type: tool
        height: 110
        id: normalize
        position: {x: 660, y: 320}
        positionAbsolute: {x: 660, y: 320}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
      - data:
          context: {enabled: false, variable_selector: []}
          desc: Global low-detail pass before any screenshot is treated as an asset.
          memory: {enabled: false, window: {enabled: false, size: 20}}
          model: {completion_params: {temperature: 0.1}, mode: chat, name: '', provider: ''}
          prompt_template:
            - role: system
              text: >-
                Reconstruct one campaign from all evidence. Paths and filenames are weak contextual
                signals; visible platform UI and content evidence win conflicts. Group tabs, scroll
                slices, and later snapshots into logical assets. Never guess confident names. Use
                only the configured structured output. Every asset must contain at least one
                source_files entry copied exactly from the manifest: prefer relative_path when it
                is non-null, otherwise use transport_name. Never emit an asset with an empty
                source_files list. Relationship file values must use the same exact manifest names.
            - role: user
              text: |-
                Manifest: {{#normalize.manifest_json#}}
                Optional instruction: {{#start.optional_instruction#}}
          selected: false
          structured_output:
            schema:
              type: object
              required: [campaign, client, assets]
              properties:
                campaign: {$ref: '#/$defs/inference'}
                client: {$ref: '#/$defs/inference'}
                assets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [asset_group_id, creator, platform, content_format, source_files, relationships]
                    properties:
                      asset_group_id: {type: string}
                      creator: {type: [string, 'null']}
                      platform: {type: string, enum: [instagram, facebook, meta, unknown]}
                      content_format: {type: string, enum: [post, reel, story, ad, unknown]}
                      source_files: {type: array, minItems: 1, items: {type: string}}
                      relationships:
                        type: array
                        items:
                          type: object
                          required: [file, role, relationship]
                          properties:
                            file: {type: string}
                            role: {type: string}
                            relationship: {type: string, enum: [exact_duplicate, near_duplicate, same_asset_scroll_slice, same_asset_other_tab, same_story_later_snapshot, different_story_same_series, repost, different_asset, unknown]}
                      warnings: {type: array, items: {type: string}}
              $defs:
                inference:
                  type: object
                  required: [name, confidence, evidence]
                  properties:
                    name: {type: string}
                    confidence: {type: number, minimum: 0, maximum: 1}
                    evidence: {type: array, items: {type: string}}
          structured_output_enabled: true
          title: Global campaign reconstruction
          type: llm
          variables: []
          vision:
            enabled: true
            configs:
              detail: low
              variable_selector: [normalize, files]
        height: 150
        id: reconstruct
        position: {x: 970, y: 320}
        positionAbsolute: {x: 970, y: 320}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 280
      - data:
          desc: Extract each reconstructed asset with only its selected screenshots.
          error_handle_mode: terminated
          is_parallel: false
          iterator_input_type: array[object]
