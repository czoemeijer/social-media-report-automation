[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "social-report-automation"
version = "2.0.0"
description = "Auditable social-media campaign reconstruction and deterministic reporting core"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Social Media Report Automation contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
images = ["Pillow>=10.3,<13"]
dev = [
  "Pillow>=10.3,<13",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/social_report"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["social_report"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
